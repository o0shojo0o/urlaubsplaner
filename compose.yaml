services:
  app:
    build: .
    image: urlaubsplaner:local
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:${HOST_PORT:-3000}:3000'
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TZ: Europe/Berlin
    volumes:
      - app-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 2
volumes:
  app-data:
