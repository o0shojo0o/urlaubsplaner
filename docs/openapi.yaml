  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "urlaubsplaner_dev"
      },
      "secureSessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-session"
      },
      "csrfToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token"
      }
    },
    "schemas": {
      "Date": {
        "type": "string",
        "format": "date",
        "example": "2027-07-12"
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "requestId": {
                "type": "string"
              },
              "details": {
                "type": "object"
              }
            }
          }
        }
      },
      "Booking": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "startDate",
          "endDate"
        ],
        "properties": {
          "startDate": {
            "$ref": "#/components/schemas/Date"
          },
          "endDate": {
            "$ref": "#/components/schemas/Date"
          },
          "startPart": {
            "type": "string",
            "enum": [
              "FULL",
              "AM",
              "PM"
            ],
            "default": "FULL"
          },
          "endPart": {
            "type": "string",
            "enum": [
              "FULL",
              "AM",
              "PM"
            ],
            "default": "FULL"
          },
          "privateNote": {
            "type": "string",
            "maxLength": 1000
          },
          "userId": {
            "type": "string",
            "description": "Nur Admin: Zielmitarbeiter."
          },
          "reason": {
            "type": "string",
            "minLength": 3,
            "maxLength": 500,
            "description": "Bei fremden/rückwirkenden Adminänderungen erforderlich."
          }
        }
      },
      "Version": {
        "type": "integer",
        "minimum": 1
      },
      "Holiday": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "date",
          "name"
        ],
        "properties": {
          "date": {
            "$ref": "#/components/schemas/Date"
          },
          "name": {
            "type": "string",
            "maxLength": 100
          },
          "blockedSlots": {
            "type": "string",
            "enum": [
              "FULL",
              "AM",
              "PM"
            ],
            "default": "FULL"
          }
        }
      }
    },
    "responses": {
      "Error400": {
        "description": "Ungültige Eingabe",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error401": {
        "description": "Nicht angemeldet",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error403": {
        "description": "Keine Berechtigung oder ungültiger CSRF-/Origin-Nachweis",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Error404": {
        "description": "Nicht vorhanden oder nicht zugänglich",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
