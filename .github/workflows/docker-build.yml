name: Docker build
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check Dockerfile exists
        shell: bash
        run: |
          if [[ ! -f Dockerfile ]]; then
            echo '::error::Dockerfile fehlt. Der Build kann erst nach Implementierung erfolgreich sein.'
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: urlaubsplaner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
