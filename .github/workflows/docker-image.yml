name: Docker-Image für Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  docker:
    name: Release-Image bauen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quellcode des Releases laden
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Image-Namen und Release-Tags bestimmen
        id: image
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ || ${#RELEASE_VERSION} -gt 128 ]]; then
            echo '::error::Release-Tag muss eine Docker-kompatible SemVer sein, z. B. v1.0.0.'
            exit 1
          fi
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          revision=$(git rev-parse HEAD)
          tags=("$image:$RELEASE_VERSION" "$image:$revision")
          if [[ "$RELEASE_VERSION" == v* ]]; then tags+=("$image:${RELEASE_VERSION#v}"); fi
          if [[ "$RELEASE_PRERELEASE" == false && "$RELEASE_VERSION" != *-* ]]; then tags+=("$image:latest"); fi
          {
            echo "name=$image"
            echo "revision=$revision"
            echo "version=$RELEASE_VERSION"
            echo 'tags<<IMAGE_TAGS'
            printf '%s\n' "${tags[@]}"
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Prisma-Client generieren
        run: npm run db:generate

      - name: Code und Tests prüfen
        run: |
          npm run check
          npm test

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release-Image bauen und veröffentlichen
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis zusammenfassen
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Release-Image veröffentlicht'
            echo "Image: \`$IMAGE\`"
            echo "Digest: \`$IMAGE_DIGEST\`"
            echo ''
            echo '### Tags'
            printf '%s\n' "$IMAGE_TAGS" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
