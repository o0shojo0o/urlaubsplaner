version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      actions-nonbreaking:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      prisma:
        patterns: ['prisma', '@prisma/*']
        update-types: [minor, patch]
      frontend:
        patterns:
          ['react', 'react-dom', '@fullcalendar/*', '*vite*', 'tailwindcss', '@tailwindcss/*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
